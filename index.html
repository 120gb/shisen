function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeBoard(){const a=[];for(let id=0;id<34;id++)for(let k=0;k<4;k++)a.push(id);return shuffle(a)}
function formatted(n){return Math.round(n).toLocaleString('ja-JP')}
function bonusForPair(n){return 100*(1+Math.floor(n/5))}
function setStatus(txt){$('status').textContent=txt}
function updateHud(){ $('time').textContent=Math.max(0,Math.ceil(remaining));$('score').textContent=formatted(score);$('timeFill').style.width=`${Math.max(0,Math.min(100,remaining/DURATION*100))}%`; }
function updateEdges(){
 for(let i=0;i<N;i++){
  const el=cells[i];if(!el)continue;
  if(board[i]===null){el.classList.remove('top-open');continue;}

let lastTouchInput=0;

    if(activeTouchIds.has(touch.identifier))continue;
    activeTouchIds.add(touch.identifier);
    const hit=document.elementFromPoint(touch.clientX,touch.clientY);
    const el=hit&&hit.closest?hit.closest('.tile'):null;

function render(){
 const frag=document.createDocumentFragment();cells=[];
 for(let i=0;i<N;i++){
  const el=document.createElement('button');el.type='button';el.className='tile';
  el.setAttribute('aria-label',`${Math.floor(i/COLS)+1}行${i%COLS+1}列 ${board[i]===null?'空き':TILE_NAMES[board[i]]}`);
  if(board[i]===null){el.classList.add('empty');el.disabled=true;}
  else{
   const glyph=document.createElement('img');
   glyph.className='glyph';glyph.src=ICONS[board[i]];glyph.alt='';glyph.draggable=false;
   glyph.setAttribute('aria-hidden','true');el.appendChild(glyph);
  }
  
  // Each physical contact is handled once. Touch events are delegated to the board.
  el.dataset.tileIndex=String(i);

 const W=COLS+2,H=ROWS+2, ax=a%COLS+1,ay=Math.floor(a/COLS)+1,bx=b%COLS+1,by=Math.floor(b/COLS)+1;
 const DX=[1,0,-1,0],DY=[0,1,0,-1],minTurns=new Int8Array(W*H*4);minTurns.fill(3);
 const q=[],isPassable=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&(x===bx&&y===by||x===0||y===0||x===W-1||y===H-1||layout[(y-1)*COLS+(x-1)]===null);
 for(let d=0;d<4;d++){
  const nx=ax+DX[d],ny=ay+DY[d];if(!isPassable(nx,ny))continue;
  const at=(ny*W+nx)*4+d;minTurns[at]=0;q.push([nx,ny,d,0]);
 }
 for(let head=0;head<q.length;head++){
  const [x,y,dir,t]=q[head];if(t!==minTurns[(y*W+x)*4+dir])continue;
  if(x===bx&&y===by)return true;
  for(let d=0;d<4;d++){
   if(d===(dir+2)%4)continue;
   const nt=t+(d===dir?0:1);if(nt>2)continue;
   const nx=x+DX[d],ny=y+DY[d];if(!isPassable(nx,ny))continue;
   const at=(ny*W+nx)*4+d;if(nt>=minTurns[at])continue;
   minTurns[at]=nt;q.push([nx,ny,d,nt]);
  }
 }
 return false;
}
function hasMove(layout=board){const groups=Array.from({length:34},()=>[]);for(let i=0;i<N;i++)if(layout[i]!==null)groups[layout[i]].push(i);
 for(const p of groups)for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++)if(pathExists(p[i],p[j],layout))return true;
 return false;
}
function newPlayableBoard(){let b=makeBoard();for(let attempt=0;attempt<100&&!hasMove(b);attempt++)b=makeBoard();return b;}
function playTone(freq=600,length=.06){if(!audioOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),vol=audioCtx.createGain();osc.frequency.value=freq;osc.type='sine';vol.gain.setValueAtTime(.055,audioCtx.currentTime);vol.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+length);osc.connect(vol).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+length)}catch(_){}}
function recordBest(){if(score>bestScore){bestScore=score;try{localStorage.setItem('shisen_best_v3',String(bestScore))}catch(_){}}}
function showGain(amount){const el=$('gain');el.textContent=`${amount>=0?'+':''}${formatted(amount)}`;el.classList.add('visible');clearTimeout(gainTimer);gainTimer=setTimeout(()=>el.classList.remove('visible'),900);}
function choose(i){if(phase!=='playing'||rerolling||board[i]===null)return;
 if(selected<0){selected=i;cells[i].classList.add('selected');playTone(480,.035);return;}
 if(selected===i){cells[i].classList.remove('selected');selected=-1;return;}
 const a=selected;selected=-1;cells[a].classList.remove('selected');
 if(board[a]===board[i]&&pathExists(a,i)){
  removeAt(a);removeAt(i);combo++;const points=bonusForPair(combo);score+=points;recordBest();showGain(points);playTone(720,.07);setStatus(`${combo}連続 ／ +${formatted(points)}点`);
  if(board.every(v=>v===null)){
   const bonus=Math.max(0,Math.floor(remaining))*1000;
   score+=bonus;recordBest();showGain(points+bonus);finish('clear',bonus);return;
  }
 }else{
  const penalty=Math.min(500,score);score=Math.max(0,score-500);combo=0;
  if(penalty>0)showGain(-penalty);else{$('gain').classList.remove('visible');clearTimeout(gainTimer)}
  playTone(185,.11);setStatus(penalty>0?`ミス：-${penalty}点 ／ 連続消去リセット`:'ミス：0点のため減点なし ／ 連続消去リセット');
  for(const pos of [a,i])cells[pos].classList.add('miss');
  setTimeout(()=>{if(cells[a])cells[a].classList.remove('miss');if(cells[i])cells[i].classList.remove('miss')},180);
 }
 updateHud();
}
function stopTimers(){cancelAnimationFrame(raf);clearTimeout(rerollTimer);rerollTimer=0;}
function clearOverlay(){overlay.hidden=true;$('resultScore').hidden=true;}
function startGame(fresh=true){
 stopTimers();phase='playing';rerolling=false;rerollDue=0;$('rerollMessage').hidden=true;$('reroll').disabled=false;selected=-1;score=0;combo=0;remaining=DURATION;
 if(fresh||original.length!==N)original=newPlayableBoard();board=original.slice();render();clearOverlay();setStatus('同じ絵柄の牌を2枚タップ（2本指でも操作できます）');$('gain').classList.remove('visible');
 deadline=Date.now()+DURATION*1000;raf=requestAnimationFrame(tick);
}
function finishReroll(){
 if(phase!=='playing'||!rerolling)return;
 if(Date.now()>=deadline){remaining=0;finish('timeout',0);return;}
 clearTimeout(rerollTimer);rerollTimer=0;rerolling=false;$('rerollMessage').hidden=true;$('reroll').disabled=false;
 const before=original.slice();let next;
 do{next=newPlayableBoard();}while(next.every((value,i)=>value===before[i]));
 original=next;board=next.slice();selected=-1;render();
 setStatus('新しい盤面に切り替えました。残り時間は継続中');
}
function requestReroll(){
 if(phase!=='playing'||rerolling)return;
 remaining=Math.max(0,(deadline-Date.now())/1000);
 if(remaining<=0){finish('timeout',0);return;}
 rerolling=true;rerollDue=Date.now()+2000;
 if(selected>=0&&cells[selected])cells[selected].classList.remove('selected');selected=-1;
 score=0;combo=0;clearTimeout(gainTimer);$('gain').classList.remove('visible');updateHud();
 $('reroll').disabled=true;$('rerollMessage').hidden=false;$('rerollSeconds').textContent='2';
 setStatus('盤面を切り替え中。得点は0点、時間は進行中');
 rerollTimer=setTimeout(finishReroll,2000);
}
function tick(){
 if(phase!=='playing')return;
 remaining=Math.max(0,(deadline-Date.now())/1000);updateHud();
 if(remaining<=0){finish('timeout',0);return;}
 if(rerolling){const wait=rerollDue-Date.now();if(wait<=0)finishReroll();else $('rerollSeconds').textContent=String(Math.ceil(wait/1000));}
 if(phase==='playing')raf=requestAnimationFrame(tick);
}
function finish(reason,bonus){if(phase!=='playing')return;
 stopTimers();rerolling=false;rerollDue=0;$('rerollMessage').hidden=true;$('reroll').disabled=true;phase='result';selected=-1;
 for(let i=0;i<N;i++)removeAt(i);  // Missing tile = black, not a white or gray square.
 if(reason==='timeout')remaining=0;updateHud();recordBest();
 $('dialogTitle').textContent=reason==='timeout'?'TIME UP':'全消し！';
 $('dialogText').textContent=reason==='timeout'?'80秒終了':`残り時間ボーナス +${formatted(bonus)}点`;
 $('resultScore').textContent=`${formatted(score)} 点`;$('resultScore').hidden=false;
 $('mainButton').textContent='次のゲーム';overlay.hidden=false;
 setStatus(`最終得点：${formatted(score)}点 ／ 最高記録：${formatted(bestScore)}点`);
 // 次ゲームはプレイヤーがボタンを押した場合にのみ開始する。
}

// Full-viewport, centered board. The game itself remains at the original 1464:1012 ratio.
const stage=$('landscapeStage'),row=$('playRow');
const GAME_RATIO=1464/1012;
let sizingPending=false;
function sizeGame(){
 sizingPending=false;
 const w=row.clientWidth,h=row.clientHeight;
 if(!w||!h)return;
 // Reserve only the minimum space required for the two side controls.
 // On wide phones the board takes the entire usable screen height.
 const minRail=Math.min(55,Math.max(42,Math.floor(w*.065)));
 const allowedWidth=Math.max(1,w-2*minRail);
 const gameHeight=Math.min(h,allowedWidth/GAME_RATIO);
 const gameWidth=gameHeight*GAME_RATIO;
 const railWidth=(w-gameWidth)/2;
 $('game').style.width=gameWidth+'px';
 $('game').style.height=gameHeight+'px';
 row.style.setProperty('--game-height',gameHeight+'px');
 $('leftRail').style.width=railWidth+'px';
 $('rightRail').style.width=railWidth+'px';
}
function scheduleSize(){if(sizingPending)return;sizingPending=true;requestAnimationFrame(sizeGame)}
window.addEventListener('resize',scheduleSize);
window.addEventListener('orientationchange',scheduleSize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleSize);
document.addEventListener('fullscreenchange',scheduleSize);
if(typeof ResizeObserver!=='undefined')new ResizeObserver(scheduleSize).observe(row);
scheduleSize();

// A normal web tab cannot be forced into browser-chrome-free fullscreen at load.
// Request it from the real Game Start gesture (Android, supporting browsers).
// On iPad Safari the installable Home Screen web app is the chrome-free route.
function requestMobileImmersion(){
 const ipad=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ipad)return; // iPad Safari: true browser-chrome-free view via Home Screen web app.
 if(!matchMedia('(pointer:coarse)').matches)return;
 if(document.fullscreenElement)return;
 try{
  if(document.documentElement.requestFullscreen){
   const p=document.documentElement.requestFullscreen({navigationUI:'hide'});
   if(p&&typeof p.then==='function')p.then(()=>{
     try{if(screen.orientation&&screen.orientation.lock){const lock=screen.orientation.lock('landscape');if(lock&&lock.catch)lock.catch(()=>{});}}catch(_){}}
    ).catch(()=>{});
  }
 }catch(_){/* On iPad Safari: standalone installation is needed. */}
}
const standalone=window.navigator.standalone===true||
 matchMedia('(display-mode:standalone)').matches||matchMedia('(display-mode:fullscreen)').matches;
if((/iPad|iPhone|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&!standalone){
 $('dialogText').textContent+='　※iPad/iPhoneでURLやタブを消して遊ぶには、Safariの共有メニューから「ホーム画面に追加」し、そのアイコンから起動してください。';
}
$('mainButton').addEventListener('click',()=>{
 requestMobileImmersion();startGame(true);
});
$('reroll').addEventListener('click',requestReroll);
$('sound').addEventListener('click',()=>{audioOn=!audioOn;$('sound').textContent=`音：${audioOn?'ON':'OFF'}`;$('sound').setAttribute('aria-pressed',String(audioOn))});
window.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(phase==='playing'){cancelAnimationFrame(raf);tick()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected>=0){if(cells[selected])cells[selected].classList.remove('selected');selected=-1;}});
original=newPlayableBoard();board=original.slice();render();setStatus('ゲーム開始を押してください');
if('serviceWorker' in navigator&&location.protocol==='https:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
