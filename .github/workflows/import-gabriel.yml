name: Import approved Gabriel image
on:
  push:
    paths:
      - '.github/workflows/import-gabriel.yml'
permissions:
  contents: write
jobs:
  import-gabriel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download user-approved character image
        env:
          IMAGE_URL: 'https://images.openai.com/static-rsc-4/3ZgMguxCokJt4NgnDWij2DW4HpsMMT2Lvc0_UO3ohwC-n_2fRGXnLRBhQ8Z1mdww1mxITIhaZCqz2qg9tBdG-jVMO8hltiUxDXvtszL6zCOJgxvu_P-Ai0jwl_0B328v4G-aisCPrp_PfN3qmFTFei83q17FqRgKlGWcf0sMClM?purpose=inline'
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$IMAGE_URL" -o /tmp/gabriel-source
          file /tmp/gabriel-source
      - name: Convert white exterior to transparency
        run: |
          python -m pip install --quiet pillow numpy scipy
          python - <<'PY'
          from PIL import Image
          import numpy as np
          from scipy.ndimage import label, gaussian_filter
          im=Image.open('/tmp/gabriel-source').convert('RGB')
          rgb=np.asarray(im,dtype=np.float32)
          white=(rgb.min(axis=2)>241)&((rgb.max(axis=2)-rgb.min(axis=2))<13)
          components,_=label(white)
          edge=np.unique(np.concatenate((components[0,:],components[-1,:],components[:,0],components[:,-1])))
          mask=np.isin(components,edge)&(components>0)
          alpha=gaussian_filter((~mask).astype('float32'),.55)
          rgba=np.dstack((rgb.astype('uint8'),np.clip(alpha*255,0,255).astype('uint8')))
          result=Image.fromarray(rgba,'RGBA')
          result.thumbnail((520,520),Image.Resampling.LANCZOS)
          result.save('challenge/gabriel.webp',format='WEBP',quality=84,method=6)
          print('saved image challenge/gabriel.webp')
          PY
      - name: Commit character asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge/gabriel.webp
          git commit -m "Import original approved Gabriel illustration as game asset"
          git push
