name: Verify million-point finale in real competition HTML
on:
  push:
    paths:
      - '.github/workflows/test-million.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Chrome, fonts and recorder
        run: |
          python -m pip install --quiet playwright imageio-ffmpeg
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Run real game and verify each phase
        run: |
          cat >/tmp/million_test.py <<'PY'
          import subprocess,time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import imageio_ffmpeg
          server=subprocess.Popen(["python","-m","http.server","8123","--bind","127.0.0.1"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
            time.sleep(1)
            with sync_playwright() as p:
              browser=p.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox","--disable-dev-shm-usage"])
              page=browser.new_page(viewport={"width":1280,"height":720},device_scale_factor=1)
              errors=[]
              page.on("pageerror",lambda err:errors.append(str(err)))
              # Clock is under deterministic automation control; game itself is unchanged.
              page.clock.install()
              page.goto("http://127.0.0.1:8123/challenge/?million_preview=1",wait_until="load",timeout=30000)
              assert page.locator('#millionScreen').is_visible()
              assert not page.locator('#contestPanel').is_visible()
              assert not page.locator('#millionButtons').is_visible()
              print("Million overlay shown; 100-cell sheet hidden; controls hidden during animation.")
              # Drive frames by the actual requestAnimationFrame callback with simulated seconds.
              # This verifies the exact running game's draw functions and UI transitions.
              page.evaluate('''() => {
                if (millionRAF)cancelAnimationFrame(millionRAF);
                millionRAF=0;millionStart=0;millionLastFrame=0;
                millionParticles=[];millionBurstNext=MILLION_RAIN_END;
              }''')
              video="challenge/million_actual_gameplay.mp4"
              ff=subprocess.Popen([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-loglevel','error',
                                  '-f','image2pipe','-vcodec','png','-framerate','4','-i','-',
                                  '-c:v','libx264','-pix_fmt','yuv420p','-preset','veryfast','-crf','23',
                                  '-movflags','+faststart',video],stdin=subprocess.PIPE)
              # 10.0s of full-size game video; capture meaningful milestones.
              for frame in range(41):
                simulated_ms=frame*1000/4
                page.evaluate('''(ms) => {
                  if(millionRAF)cancelAnimationFrame(millionRAF);
                  millionRAF=0;
                  millionFrame(ms);
                  if(millionRAF)cancelAnimationFrame(millionRAF);
                  millionRAF=0;
                }''',simulated_ms)
                if frame in [4,15,24,37]:
                  snap=f"challenge/million_phase_{frame}.png"
                  page.screenshot(path=snap,type="png")
                  state=page.evaluate('''(ms) => ({
                    elapsed:ms, running:millionRunning, buttons:!document.getElementById('millionButtons').hidden,
                    particles:millionParticles.length,
                    rain: millionTiles.filter(t=>ms>=t.delay&&(-t.size*2+t.speed*(ms-t.delay))<millionSizeH+t.size*2).length,
                    gridHidden:document.getElementById('contestPanel').hidden
                  })''',simulated_ms)
                  print('MILESTONE',frame,state)
                  assert state['gridHidden'], "record grid exposed during finale"
                  if frame==4:assert state['rain']>0
                  if frame==24:assert state['particles']>0
                  if frame==37:assert state['buttons'] and not state['running']
                if frame==37:assert page.locator('#millionRestart').is_visible()
                ff.stdin.write(page.screenshot(type='png',animations='allow'))
              ff.stdin.close()
              assert ff.wait()==0
              assert not errors, "JavaScript errors: "+repr(errors)
              print('VIDEO FILE:',video,Path(video).stat().st_size)
              # Controls must not remove real contest entries in preview.
              page.locator('#millionRestart').click()
              page.wait_for_url("http://127.0.0.1:8123/challenge/",timeout=8000)
              print('PREVIEW RESTART: returned to regular game without resetting saved entries.')
              browser.close()
          finally:
            server.terminate()
          PY
          python /tmp/million_test.py
      - name: Commit actual-game recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge/million_actual_gameplay.mp4 challenge/million_phase_*.png
          git commit -m "Record verified million-point finale in actual game HTML"
          git push
