name: Capture actual Gabriel game screen
on:
  push:
    paths:
      - '.github/workflows/capture-gabriel.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        run: |
          python -m pip install --quiet playwright imageio-ffmpeg
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Record real competition HTML in Chrome
        run: |
          cat > /tmp/capture.py <<'PY'
          import os,subprocess,imageio_ffmpeg
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import time
          server=subprocess.Popen(["python","-m","http.server","8123","--bind","127.0.0.1"],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
            time.sleep(1.5)
            target='challenge/gabriel_actual_gameplay.mp4'
            with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':1600,'height':900},device_scale_factor=1,reduced_motion='reduce')
              page.clock.install()
              page.goto('http://127.0.0.1:8123/challenge/?gabriel_preview=1',wait_until='load',timeout=30000)
              page.wait_for_selector('#gabrielEvent:not([hidden])',timeout=10000)
              print('page title:',page.title())
              print('Gabriel image:',page.locator('.gabriel-illustration').get_attribute('src'))
              print('contest table visible:',page.locator('#contestPanel').is_visible())
              assert page.locator('.gabriel-illustration').get_attribute('src')=='./gabriel.webp'
              assert page.locator('#contestPanel').is_visible()
              # Set the actual game's CSS animations to a deterministic timeline.
              # Screenshots taken slower than real-time must not allow CSS to finish
              # before the video reaches that frame.
              page.evaluate("""() => {
                window.__gabAnimations = [...document.querySelectorAll('#gabrielEvent, #gabrielEvent *')]
                  .flatMap(el=>el.getAnimations({subtree:false}));
                window.__gabAnimations.forEach(a=>a.pause());
                return window.__gabAnimations.length;
              }""")
              print('animated elements:',page.evaluate('window.__gabAnimations.length'))
              ff=subprocess.Popen([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-loglevel','error','-f','image2pipe','-vcodec','png',
                                   '-framerate','15','-i','-','-c:v','libx264','-pix_fmt','yuv420p',
                                   '-preset','veryfast','-crf','23','-movflags','+faststart',target],
                                  stdin=subprocess.PIPE)
              for i in range(105):
                if i:
                  ms=i*1000/15
                  page.evaluate("(ms)=>window.__gabAnimations.forEach(a=>{a.currentTime=ms;})",ms)
                if i in [0,15,42,65,90]:
                  print('frame',i,'hidden',page.locator('#gabrielEvent').get_attribute('hidden'),
                    'opacity',page.locator('.gabriel-fly').evaluate('(el)=>getComputedStyle(el).opacity'))
                if i==42:
                  page.screenshot(path='challenge/gabriel_actual_screen.png',type='png')
                ff.stdin.write(page.screenshot(type='png',animations='allow'))
              ff.stdin.close()
              if ff.wait()!=0:raise RuntimeError('ffmpeg failed')
              browser.close()
            print('recording',target,Path(target).stat().st_size)
          finally:
            server.terminate()
          PY
          python /tmp/capture.py
      - name: Publish capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge/gabriel_actual_gameplay.mp4 challenge/gabriel_actual_screen.png
          git commit -m "Capture Gabriel milestone running in actual competition HTML"
          git push
